<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sagar U — AI-Focused Full Stack Developer</title>
    <meta name="description" content="Sagar U is a BCA graduate and AI-focused full-stack developer from Bangalore building AI-powered web applications, modern digital experiences and cloud-ready products." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Advanced feature: Dynamically make the favicon a perfect circle
      window.onload = function() {
        const link = document.querySelector("link[rel*='icon']");
        if (link) {
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.src = link.href;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            // Force the canvas to be a perfect square based on the smallest dimension
            const size = Math.min(img.width, img.height);
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw a perfect circle clip inside the square canvas
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();
            
            // Draw the image, centered in the square
            const xOffset = (size - img.width) / 2;
            const yOffset = (size - img.height) / 2;
            ctx.drawImage(img, xOffset, yOffset, img.width, img.height);
            
            // Replace the favicon with the new perfectly circular square-ratio version
            link.href = canvas.toDataURL('image/png');
          };
        }
      };
    </script>
  </body>
</html>
